name: Azure ARM and Blob Storage test

on:
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: azure-arm-blob-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
      AZURE_STORAGE_BLOB: ${{ vars.AZURE_STORAGE_BLOB }}
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP AZURE_STORAGE_ACCOUNT AZURE_STORAGE_CONTAINER AZURE_STORAGE_BLOB; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing repository variable: $variable"
              exit 1
            fi
          done
          echo "TEST_BLOB_NAME=${AZURE_STORAGE_BLOB%.zip}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" >> "$GITHUB_ENV"

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0 (Node.js 24)
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Test ARM management-plane access
        shell: bash
        run: |
          set -euo pipefail
          az storage account show \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_STORAGE_ACCOUNT" \
            --only-show-errors
          echo "ARM storage account read succeeded."

      - name: Create test ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          payload = {
              "message": "GitHub Actions ARM and Blob Storage connectivity test",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "actions-test.zip"
          with ZipFile(path, "w", compression=ZIP_DEFLATED) as archive:
              archive.writestr("test.json", json.dumps(payload, indent=2) + "\n")
          print(f"Created test ZIP ({path.stat().st_size} bytes).")
          PY

      - name: Upload ZIP using Entra ID data-plane authorization
        shell: bash
        run: |
          set -euo pipefail
          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_STORAGE_CONTAINER" \
            --name "$TEST_BLOB_NAME" \
            --file "$RUNNER_TEMP/actions-test.zip" \
            --content-type application/zip \
            --auth-mode login \
            --overwrite false \
            --only-show-errors
          echo "Blob upload succeeded."

      - name: Download and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          az storage blob download \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_STORAGE_CONTAINER" \
            --name "$TEST_BLOB_NAME" \
            --file "$RUNNER_TEMP/downloaded-actions-test.zip" \
            --auth-mode login \
            --only-show-errors
          cmp "$RUNNER_TEMP/actions-test.zip" "$RUNNER_TEMP/downloaded-actions-test.zip"
          checksum="$(sha256sum "$RUNNER_TEMP/downloaded-actions-test.zip" | cut -d ' ' -f 1)"
          {
            echo "## Azure connectivity test passed"
            echo "- ARM management-plane read: succeeded"
            echo "- Blob data-plane upload and download: succeeded"
            echo "- Blob: \`$TEST_BLOB_NAME\`"
            echo "- ZIP SHA-256 verified: \`$checksum\`"
            echo "- Runner: GitHub-hosted Ubuntu"
          } >> "$GITHUB_STEP_SUMMARY"
